<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Practice App</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-light: #6B7280;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

    /* Card Styling */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* Top Bar & Stats */
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .stat-badge { background: #EEF2FF; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; color: var(--primary); }

    /* Day Navigation */
    .day-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #E5E7EB; color: var(--text); }
    .btn-secondary:hover { background: #D1D5DB; }

    /* Question Display */
    .q-counter { font-size: 0.85rem; color: var(--text-light); text-align: center; margin-top: 10px; font-weight: 600; }
    .question-box { font-size: 1.15rem; font-weight: 600; margin: 15px 0; text-align: center; min-height: 55px; display: flex; align-items: center; justify-content: center; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-btn { padding: 12px; border: 2px solid #E5E7EB; border-radius: 8px; background: white; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { border-color: var(--primary); background: #EEF2FF; }

    /* PIN Modal & Analytics Modal */
    .modal-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-card { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; }
    .modal-card input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 1.2rem; text-align: center; letter-spacing: 4px; }

    .hidden { display: none !important; }
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .analytics-item { background: #F9FAFB; padding: 10px; border-radius: 8px; border: 1px solid #E5E7EB; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Header & Stats Bar -->
  <div class="card">
    <div class="top-bar" style="margin-bottom: 12px;">
      <h2 style="font-size: 1.2rem; color: var(--primary);">Daily Practice</h2>
      <button class="btn btn-secondary" onclick="openSyllabusModal()" style="font-size: 0.8rem; padding: 6px 10px;">Manage Syllabus</button>
    </div>
    <div class="stats-bar">
      <div class="stat-badge">🔥 <span id="streakCount">0</span> Days</div>
      <div class="stat-badge">⭐ <span id="totalPoints">0</span> Pts</div>
      <button class="btn" onclick="openAnalyticsModal()" style="font-size: 0.8rem; padding: 6px;">📊 Analytics</button>
    </div>
  </div>

  <!-- Main Question Card -->
  <div class="card">
    <div class="day-nav">
      <button class="btn btn-secondary" onclick="changeDay(-1)">← Prev</button>
      <span id="currentDayLabel" style="font-weight: 700;">Day 1</span>
      <button class="btn btn-secondary" onclick="changeDay(1)">Next →</button>
    </div>

    <div class="q-counter" id="questionCounter">Question 1 of 20</div>
    <div class="question-box" id="questionText">Loading question...</div>

    <div class="options-grid" id="optionsContainer">
      <!-- Options rendered via JS -->
    </div>
  </div>

</div>

<!-- Custom PIN Lock Modal -->
<div id="pinModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>Enter PIN</h3>
    <input type="password" id="pinInput" maxlength="6" placeholder="••••" />
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button class="btn btn-secondary" onclick="closePinModal()">Cancel</button>
      <button class="btn" onclick="submitPin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Analytics Dashboard Modal -->
<div id="analyticsModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3 style="margin-bottom: 10px;">📊 Performance Summary</h3>
    <div class="analytics-grid">
      <div class="analytics-item">
        <span style="font-size: 0.75rem; color: var(--text-light);">Answered</span>
        <h4 id="statTotal">0</h4>
      </div>
      <div class="analytics-item">
        <span style="font-size: 0.75rem; color: var(--text-light);">Accuracy</span>
        <h4 id="statAccuracy">0%</h4>
      </div>
      <div class="analytics-item">
        <span style="font-size: 0.75rem; color: var(--text-light);">Avg Speed</span>
        <h4 id="statSpeed">0s</h4>
      </div>
      <div class="analytics-item">
        <span style="font-size: 0.75rem; color: var(--text-light);">Needs Focus</span>
        <h4 id="statWeak" style="color: var(--danger); font-size: 0.85rem;">None</h4>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="closeAnalyticsModal()" style="width: 100%;">Close</button>
  </div>
</div>

<script>
// ==========================================
// 1. DATA & APP STATE
// ==========================================
let appData = {
  startDate: localStorage.getItem('app_start_date') || new Date().toISOString().split('T')[0],
  parentPin: localStorage.getItem('app_parent_pin') || '1234',
  currentDay: 1
};

if (!localStorage.getItem('app_start_date')) {
  localStorage.setItem('app_start_date', appData.startDate);
}

// 20 Questions per day (Maths, GK, English)
const questionsBank = {
  1: [
    { q: "25 + 15 = ?", options: ["30", "40", "35", "45"], ans: "40", cat: "Math" },
    { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "दिल्ली", "कोलकाता", "जयपुर"], ans: "दिल्ली", cat: "GK" },
    { q: "Opposite of 'Hot' is?", options: ["Cold", "Warm", "Ice", "Cool"], ans: "Cold", cat: "English" },
    { q: "5 × 6 = ?", options: ["25", "35", "30", "40"], ans: "30", cat: "Math" },
    { q: "हमारा राष्ट्रीय पक्षी कौन सा है?", options: ["कबूतर", "तोता", "मोर", "बाज़"], ans: "मोर", cat: "GK" },
    { q: "Complete the word: A _ p l e", options: ["p", "b", "t", "d"], ans: "p", cat: "English" },
    { q: "50 - 18 = ?", options: ["32", "22", "38", "28"], ans: "32", cat: "Math" },
    { q: "एक सप्ताह में कितने दिन होते हैं?", options: ["5", "6", "7", "8"], ans: "7", cat: "GK" },
    { q: "Plural of 'Cat' is?", options: ["Cats", "Cates", "Caties", "Kittens"], ans: "Cats", cat: "English" },
    { q: "100 + 250 = ?", options: ["300", "350", "400", "325"], ans: "350", cat: "Math" },
    { q: "सौरमंडल में सबसे बड़ा ग्रह कौन सा है?", options: ["पृथ्वी", "मंगल", "बृहस्पति", "शनि"], ans: "बृहस्पति", cat: "GK" },
    { q: "Which animal is known as the 'Ship of the Desert'?", options: ["Elephant", "Camel", "Horse", "Lion"], ans: "Camel", cat: "GK" },
    { q: "12 ÷ 3 = ?", options: ["3", "4", "5", "6"], ans: "4", cat: "Math" },
    { q: "सूरज किस दिशा से उगता है?", options: ["पूर्व", "पश्चिम", "उत्तर", "दक्षिण"], ans: "पूर्व", cat: "GK" },
    { q: "Select the vowel:", options: ["B", "C", "E", "F"], ans: "E", cat: "English" },
    { q: "8 × 4 = ?", options: ["24", "28", "32", "36"], ans: "32", cat: "Math" },
    { q: "हमारे शरीर में कितने फेफड़े होते हैं?", options: ["1", "2", "3", "4"], ans: "2", cat: "GK" },
    { q: "Past tense of 'Go' is?", options: ["Gone", "Going", "Went", "Goes"], ans: "Went", cat: "English" },
    { q: "75 + 25 = ?", options: ["90", "100", "110", "105"], ans: "100", cat: "Math" },
    { q: "भारत का राष्ट्रीय फूल कौन सा है?", options: ["गुलाब", "कमल", "सूरजमुखी", "गेंदा"], ans: "कमल", cat: "GK" }
  ],
  2: [
    { q: "12 × 5 = ?", options: ["50", "55", "60", "65"], ans: "60", cat: "Math" },
    { q: "गांधी जी को किस नाम से जाना जाता है?", options: ["नेताजी", "बापू", "सरदार", "चाचा"], ans: "बापू", cat: "GK" },
    { q: "Synonym of 'Big' is?", options: ["Small", "Large", "Tiny", "Short"], ans: "Large", cat: "English" },
    { q: "90 - 45 = ?", options: ["40", "45", "50", "35"], ans: "45", cat: "Math" },
    { q: "भारत का राष्ट्रीय पशु कौन सा है?", options: ["शेर", "बाघ", "हाथी", "चीता"], ans: "बाघ", cat: "GK" },
    { q: "Which month comes after July?", options: ["June", "August", "September", "May"], ans: "August", cat: "English" },
    { q: "15 + 15 + 15 = ?", options: ["30", "40", "45", "50"], ans: "45", cat: "Math" },
    { q: "तिरंगे में कितने रंग होते हैं?", options: ["2", "3", "4", "5"], ans: "3", cat: "GK" },
    { q: "Opposite of 'Fast' is?", options: ["Quick", "Slow", "Run", "High"], ans: "Slow", cat: "English" },
    { q: "81 ÷ 9 = ?", options: ["7", "8", "9", "10"], ans: "9", cat: "Math" },
    { q: "पानी का रासायनिक सूत्र क्या है?", options: ["CO2", "H2O", "O2", "N2"], ans: "H2O", cat: "GK" },
    { q: "How many hours are there in a day?", options: ["12", "24", "48", "36"], ans: "24", cat: "GK" },
    { q: "7 × 7 = ?", options: ["42", "48", "49", "56"], ans: "49", cat: "Math" },
    { q: "स्वतंत्रता दिवस कब मनाया जाता है?", options: ["26 जनवरी", "15 अगस्त", "2 अक्टूबर", "14 नवंबर"], ans: "15 अगस्त", cat: "GK" },
    { q: "Correct spelling:", options: ["Schoold", "School", "Scool", "Skool"], ans: "School", cat: "English" },
    { q: "200 - 80 = ?", options: ["110", "120", "130", "140"], ans: "120", cat: "Math" },
    { q: "मानव शरीर की सबसे बड़ी हड्डी कौन सी है?", options: ["फीमर", "स्टेप्स", "रेडियस", "अल्ना"], ans: "फीमर", cat: "GK" },
    { q: "Young one of a 'Dog' is called?", options: ["Kitten", "Calf", "Puppy", "Cub"], ans: "Puppy", cat: "English" },
    { q: "60 ÷ 5 = ?", options: ["10", "11", "12", "15"], ans: "12", cat: "Math" },
    { q: "हमारे देश के प्रथम प्रधानमंत्री कौन थे?", options: ["मात्मा गांधी", "जवाहरलाल नेहरू", "राजेंद्र प्रसाद", "भगत सिंह"], ans: "जवाहरलाल नेहरू", cat: "GK" }
  ]
};

let currentQuestionIndex = 0;
let pendingTargetDay = null;

// ==========================================
// 2. AUDIO & HAPTIC SYSTEM
// ==========================================
const SoundFx = {
  ctx: null,
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playCorrect() {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
    osc.frequency.exponentialRampToValueAtTime(659.25, this.ctx.currentTime + 0.15); // E5
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);

    if (navigator.vibrate) navigator.vibrate(50);
  },
  playIncorrect() {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime); // A3
    osc.frequency.exponentialRampToValueAtTime(130.81, this.ctx.currentTime + 0.2); // C3
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);

    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  }
};

// ==========================================
// 3. GAMIFICATION & ANALYTICS
// ==========================================
const Gamification = {
  pts: parseInt(localStorage.getItem('app_points') || '0'),
  streak: parseInt(localStorage.getItem('app_streak') || '0'),
  lastActive: localStorage.getItem('app_last_active'),

  update() {
    document.getElementById('streakCount').innerText = this.streak;
    document.getElementById('totalPoints').innerText = this.pts;
  },
  addCorrect() {
    this.pts += 10;
    const today = new Date().toISOString().split('T')[0];
    if (this.lastActive !== today) {
      this.streak += 1;
      this.lastActive = today;
      localStorage.setItem('app_last_active', today);
      localStorage.setItem('app_streak', this.streak);
    }
    localStorage.setItem('app_points', this.pts);
    this.update();
  }
};

const Analytics = {
  startTime: null,
  logs: JSON.parse(localStorage.getItem('app_analytics_logs') || '[]'),

  startTimer() { this.startTime = Date.now(); },
  logAnswer(cat, isCorrect) {
    const elapsed = Math.round((Date.now() - (this.startTime || Date.now())) / 1000);
    this.logs.push({ cat: cat || 'General', isCorrect, time: elapsed });
    localStorage.setItem('app_analytics_logs', JSON.stringify(this.logs));
  },
  getSummary() {
    if (!this.logs.length) return { total: 0, accuracy: 0, avgTime: 0, weak: 'None' };
    const total = this.logs.length;
    const correct = this.logs.filter(l => l.isCorrect).length;
    const accuracy = Math.round((correct / total) * 100);
    const avgTime = Math.round(this.logs.reduce((acc, l) => acc + l.time, 0) / total);
    
    const catWrongs = {};
    this.logs.forEach(l => {
      if (!l.isCorrect) catWrongs[l.cat] = (catWrongs[l.cat] || 0) + 1;
    });
    const weak = Object.keys(catWrongs).sort((a,b) => catWrongs[b] - catWrongs[a])[0] || 'None';
    
    return { total, accuracy, avgTime, weak };
  }
};

// ==========================================
// 4. DAY NAVIGATION & PIN LOGIC
// ==========================================
function getCalculatedAllowedDay() {
  const start = new Date(appData.startDate);
  const today = new Date();
  const diffTime = today - start;
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  return Math.max(1, diffDays + 1);
}

function changeDay(delta) {
  const targetDay = appData.currentDay + delta;
  if (targetDay < 1) return;

  const maxAllowed = getCalculatedAllowedDay();
  if (targetDay > maxAllowed) {
    pendingTargetDay = targetDay;
    openPinModal();
  } else {
    appData.currentDay = targetDay;
    currentQuestionIndex = 0;
    renderQuestion();
  }
}

function openPinModal() {
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModal').classList.remove('hidden');
}

function closePinModal() {
  document.getElementById('pinModal').classList.add('hidden');
  pendingTargetDay = null;
}

function submitPin() {
  const enteredPin = document.getElementById('pinInput').value;
  if (enteredPin === appData.parentPin) {
    appData.currentDay = pendingTargetDay;
    currentQuestionIndex = 0;
    closePinModal();
    renderQuestion();
  } else {
    alert('Incorrect PIN');
    document.getElementById('pinInput').value = '';
  }
}

// ==========================================
// 5. QUESTION RENDER & ANSWER CHECKING
// ==========================================
function renderQuestion() {
  document.getElementById('currentDayLabel').innerText = `Day ${appData.currentDay}`;
  const dayQuestions = questionsBank[appData.currentDay] || [];
  const counterBox = document.getElementById('questionCounter');
  const qBox = document.getElementById('questionText');
  const optsBox = document.getElementById('optionsContainer');

  if (!dayQuestions.length || currentQuestionIndex >= dayQuestions.length) {
    counterBox.innerText = `Completed!`;
    qBox.innerText = "Great job! You have completed all questions for this day.";
    optsBox.innerHTML = '';
    return;
  }

  counterBox.innerText = `Question ${currentQuestionIndex + 1} of ${dayQuestions.length}`;
  const qData = dayQuestions[currentQuestionIndex];
  qBox.innerText = qData.q;
  optsBox.innerHTML = '';

  Analytics.startTimer();

  qData.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt, qData.ans, qData.cat);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected, correct, category) {
  const isCorrect = (selected === correct);

  if (isCorrect) {
    SoundFx.playCorrect();
    Gamification.addCorrect();
  } else {
    SoundFx.playIncorrect();
  }

  Analytics.logAnswer(category, isCorrect);

  currentQuestionIndex++;
  renderQuestion();
}

// ==========================================
// 6. ANALYTICS MODAL
// ==========================================
function openAnalyticsModal() {
  const summary = Analytics.getSummary();
  document.getElementById('statTotal').innerText = summary.total;
  document.getElementById('statAccuracy').innerText = summary.accuracy + '%';
  document.getElementById('statSpeed').innerText = summary.avgTime + 's';
  document.getElementById('statWeak').innerText = summary.weak;
  document.getElementById('analyticsModal').classList.remove('hidden');
}

function closeAnalyticsModal() {
  document.getElementById('analyticsModal').classList.add('hidden');
}

function openSyllabusModal() {
  const pin = prompt("Enter Parent PIN to manage syllabus:");
  if (pin === appData.parentPin) {
    alert("Syllabus management unlocked.");
  } else if (pin !== null) {
    alert("Incorrect PIN");
  }
}

// ==========================================
// 7. INITIALIZATION & SERVICE WORKER
// ==========================================
window.onload = () => {
  appData.currentDay = getCalculatedAllowedDay();
  Gamification.update();
  renderQuestion();
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.onupdatefound = () => {
      const installingWorker = reg.installing;
      installingWorker.onstatechange = () => {
        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
          window.location.reload();
        }
      };
    };
  }).catch(() => {});
}
</script>
</body>
</html>
